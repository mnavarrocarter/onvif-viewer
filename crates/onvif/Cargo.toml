[package]
name = "onvif"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
digest_auth = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
sha1 = "0.10"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
