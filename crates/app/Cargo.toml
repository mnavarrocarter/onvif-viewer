[package]
name = "onvif-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gstreamer = "0.25"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
onvif = { path = "../onvif" }
recording = { path = "../recording" }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
web-media = { path = "../web-media" }

[dev-dependencies]
tempfile = "3"
